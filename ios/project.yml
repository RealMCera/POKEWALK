name: PokeWalk
options:
  bundleIdPrefix: com.realmcera
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  PokeWalk:
    type: application
    platform: iOS
    sources:
      - path: PokeWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmcera.pokewalk
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PokeWalk
        INFOPLIST_KEY_NSMotionUsageDescription: "PokeWalk uses motion data to count your steps and show your walking progress."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets: []

  PokeWalkWatch:
    type: application
    platform: watchOS
    sources:
      - path: PokeWalkWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmcera.pokewalk.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PokeWalk
        INFOPLIST_KEY_NSMotionUsageDescription: "PokeWalk uses motion data to count your steps and show your walking progress."
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets: []
